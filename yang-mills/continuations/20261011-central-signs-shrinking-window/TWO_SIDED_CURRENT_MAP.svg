   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(94.373286 111.446193)">Actual original state</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(96.87563 124.923537)">v = dX,  D = L₁ + z</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(102.530317 138.400881)">A = DC,  k = A*v</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(61.88813 151.878224)">All exterior current rows retained</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(116.256098 165.355568)">TCR1–TCR8</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(360.936873 110.655959)">Cutoff columns and projection</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(415.208748 124.133302)">c̃ = Z̃⁻¹k̃</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(400.881404 137.866115)">qR = ‖v‖² − r̃²</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(396.433748 152.390334)">‖c̃‖ ≤ √(2qR / γ)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(366.939998 166.145802)">TCR9–TCR11, TCR18–TCR21</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(685.851241 110.795021)">Full inverse error</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(675.037959 124.527834)">β − Cc̃ = D⁻¹(v − Ac̃)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(675.627803 138.773927)">Δ = √(κ/z)(r̃ + εR‖c̃‖)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(647.914522 152.529396)">Original uncut metric N remains</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(695.836397 166.00674)">TCR3, TCR12</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(318.217188 310.851099)">Two-sided response → signed original window</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(357.364844 324.328443)">[√P − Δ]₊² ≤ W(z) ≤ [√P + Δ]²</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(237.301563 337.805787)">Use lower central response and upper subtracted responses at εz and Rwin z.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(230.292188 351.538599)">The cutoff error is controlled. The interacting residual r̃ remains to be evaluated.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(378.057031 365.015943)">TCR12, TCR16–TCR17</text>
   </g>
